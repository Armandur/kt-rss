services:
  kt-rss:
    build: .
    image: ghcr.io/armandur/kt-rss:latest
    container_name: kt-rss
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Namngiven volym -> SQLite överlever container-omstart (spec SS14).
      - kt-rss-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  kt-rss-data:
