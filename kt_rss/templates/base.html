<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KT-RSS{% endblock %}</title>
  <link rel="icon" href="data:,">
  {% if feed_path %}
  <link rel="alternate" type="application/atom+xml"
        title="KT-RSS{% if title %} - {{ title }}{% endif %}"
        href="{{ feed_path }}">
  {% endif %}
  <script>
    /* Applicera sparat tema före render - undviker ljus/mörk-flimmer. */
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light")
        document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <span class="brand-mark">KT</span>
        <span class="brand-text">
          <strong>KT-RSS</strong>
          <small>RSS feeds från Kyrkans Tidning</small>
        </span>
      </a>
      {% if state and state.last_run_at %}
      <a class="poll-status" href="/status">
        Senaste poll: <strong>{{ state.last_status or 'okänd' }}</strong>
        &middot; {{ state.last_run_at|sv_datetime }}
      </a>
      {% endif %}
      <button class="theme-toggle" type="button"
              aria-label="Växla mörkt/ljust tema">Tema</button>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
  <script src="/static/theme.js" defer></script>
  <script src="/static/newsince.js" defer></script>
  <script src="/static/suggest.js" defer></script>
  <script src="/static/live.js" defer></script>
</body>
</html>
